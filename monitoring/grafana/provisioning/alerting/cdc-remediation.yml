apiVersion: 1

contactPoints:
  - orgId: 1
    name: CDC Remediation Webhook
    receivers:
      - uid: cdc_remediation_webhook
        type: webhook
        disableResolveMessage: true
        settings:
          url: http://remediation:8090/webhooks/alertmanager
          httpMethod: POST
          maxAlerts: "10"

groups:
  - orgId: 1
    name: Debezium abandoned transactions
    folder: CDC Remediation
    interval: 10s
    rules:
      - uid: debezium_abandoned_transaction
        title: Debezium abandoned transaction
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum by (transaction_id, start_scn, change_time, redo_thread, event_count) (count_over_time({container="poc-kafka-connect"} |~ "Transaction [0-9A-Fa-f]{16}.*is being abandoned" | regexp "Transaction (?P<transaction_id>[0-9A-Fa-f]{16}) \\(start SCN (?P<start_scn>[0-9]+), change time (?P<change_time>[^,]+), redo thread (?P<redo_thread>[0-9]+), (?P<event_count>[0-9]+) events\\) is being abandoned\\." | event_count != "0" [2m]))'
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: range
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Debezium abandoned transaction detected
          log_line: 'Transaction {{ $labels.transaction_id }} (start SCN {{ $labels.start_scn }}, change time {{ $labels.change_time }}, redo thread {{ $labels.redo_thread }}, {{ $labels.event_count }} events) is being abandoned.'
        labels:
          alertname: DebeziumAbandonedTransaction
          connector: oracle-remediation-poc
          pipeline: cdc-remediation
        isPaused: false
        notification_settings:
          receiver: CDC Remediation Webhook
          group_by:
            - alertname
            - connector
            - transaction_id
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 4h
