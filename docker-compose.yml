name: poc

networks:
  kafka-net:
    driver: bridge

volumes:
  kafka_data:
  prometheus_data:
  loki_data:
  grafana_data:
  alloy_data:
  mssql_data:
  ranger_db_data:
  ranger_solr_data:

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: poc-mssql
    hostname: mssql
    restart: unless-stopped
    networks:
      - kafka-net
    ports:
      - "${MSSQL_PORT:-14330}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-KafkaGuardPoc!2026}
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: poc-mssql-init
    networks:
      - kafka-net
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-KafkaGuardPoc!2026}
    volumes:
      - ./db-init/ingest_reference:/db-init:ro
    entrypoint:
      - /bin/bash
      - -c
    command:
      - >
        for file in /db-init/*.sql; do
          /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i "$$file" || exit 1;
        done
    restart: "no"

  kafka:
    image: confluentinc/cp-kafka:8.1.3
    container_name: poc-kafka
    hostname: kafka
    restart: unless-stopped
    networks:
      - kafka-net
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      CLUSTER_ID: "fMnxD8DVSP-iduM35GValg"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:29093,PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092" ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-connect:
    build:
      context: .
      dockerfile: kafka-connect/Dockerfile
    image: poc/debezium-connect-jmx:3.5.2
    container_name: poc-kafka-connect
    restart: unless-stopped
    networks:
      - kafka-net
    ports:
      - "8083:8083"
      - "9404:9404"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_PORT: 8083
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: _connect.configs
      OFFSET_STORAGE_TOPIC: _connect.offsets
      STATUS_STORAGE_TOPIC: _connect.status
      KAFKA_OFFSETS_RETENTION_MINUTES: 10080
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: All
      CONNECT_PLUGIN_PATH: /kafka/connect,/connect,/connect/avro-converter,/connect/smts
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms512m -Xmx1g}
      KAFKA_OPTS: -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=9404:/opt/jmx/kafka-connect.yml
    volumes:
      - ./kafka-connect/SMTs:/connect/smts
      - ./kafka-connect/avro-converter:/connect/avro-converter
      - ./monitoring/jmx/kafka-connect.yml:/opt/jmx/kafka-connect.yml:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s

  kafka-ui:
    image: kafbat/kafka-ui:d712743
    container_name: poc-kafka-ui
    restart: unless-stopped
    networks:
      - kafka-net
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"

  remediation:
    build:
      context: .
      dockerfile: Dockerfile
    image: poc/oracle-remediation:1.0.0
    container_name: poc-remediation
    restart: unless-stopped
    networks:
      - kafka-net
    extra_hosts:
      - "oracle-host:host-gateway"
    ports:
      - "8090:8090"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      CONFIG_DB_HOST: mssql
      CONFIG_DB_PORT: 1433
      CONFIG_DB_NAME: ingest_reference
      CONFIG_DB_USER: sa
      CONFIG_DB_PASSWORD: ${MSSQL_SA_PASSWORD:-KafkaGuardPoc!2026}
      CONFIG_CACHE_TTL_SECONDS: ${CONFIG_CACHE_TTL_SECONDS:-300}
      ORACLE_LOCALHOST_ALIAS: oracle-host
      ESCALATION_WEBHOOK_URL: ${ESCALATION_WEBHOOK_URL:-}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
      mssql-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  prometheus:
    image: prom/prometheus:main-distroless
    container_name: poc-prometheus
    restart: unless-stopped
    networks:
      - kafka-net
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles

  loki:
    image: grafana/loki:main-2e3da9a
    container_name: poc-loki
    restart: unless-stopped
    networks:
      - kafka-net
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yml

  alloy:
    image: grafana/alloy:v1.16.1
    container_name: poc-alloy
    restart: unless-stopped
    networks:
      - kafka-net
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:main-distroless-slim
    container_name: poc-grafana
    restart: unless-stopped
    networks:
      - kafka-net
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

